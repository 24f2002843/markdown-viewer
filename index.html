<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Markdown Viewer</h1>
    </header>
    <main>
        <nav id="markdown-tabs">
            <button aria-selected="true">Preview</button>
            <button aria-selected="false">Source</button>
        </nav>
        <section id="markdown-preview" tabindex="0">
            <div id="preview-content"></div>
        </section>
        <section id="markdown-source" tabindex="0">
            <pre></pre>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Markdown Viewer Application</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
